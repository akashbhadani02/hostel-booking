<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPSS Hostel Dashboard By AB</title>

<style>
  /* ===== BODY & FONT ===== */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f4f6f8;
  padding: 20px;
  margin: 0;
}

/* ===== HEADING ===== */
h1 {
  text-align: center;
  margin-bottom: 20px;
  font-size: 28px;
  color: #333;
}

/* ===== CONTROLS ===== */
.controls {
  max-width: 1000px;
  margin: 10px auto;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

select, input[type="number"], input[type="date"], button {
  padding: 8px 10px;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid #ccc;
  outline: none;
}

select:focus, input:focus {
  border-color: #007bff;
}

button {
  cursor: pointer;
  background: #007bff;
  color: white;
  border: none;
  transition: background 0.2s;
}

/* button:hover {
  background: #43454715;
} */

/* ===== STATS ===== */
.stats {
  max-width: 1000px;
  margin: 20px auto;
  display: flex;
  justify-content: space-around;
  font-weight: bold;
  font-size: 16px;
}

.stats div {
  background: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* ===== FLOOR SECTIONS ===== */
.floor-section {
  margin-bottom: 30px;
  background: #fff;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* ===== FLOOR TITLE ===== */
.floor-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 15px;
  color: #333;
  text-align: left;
}

/* ===== FLOOR ROOMS GRID ===== */
.floor-rooms {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); /* Column wise */
  gap: 10px;
}

/* ===== ROOM BUTTONS ===== */
.room-btn {
  padding: 15px 0;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  color: #fff;
  position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
}

.room-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* ===== TOOLTIP & NOTE ICON ===== */
.note-icon {
  position: absolute;
  top: 3px;
  right: 6px;
  font-size: 15px;
}

.note-tooltip {
  display: none;
  position: absolute;
  bottom: 110%;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 6px 8px;
  border-radius: 5px;
  font-size: 14px;
  white-space: nowrap;
  z-index: 10;
}

.room-btn:hover .note-tooltip {
  display: block;
}

/* ===== ROOM STATUS COLORS ===== */
.empty { background: #28a745; }        /* Green */
.occupied { background: #dc3545; }     /* Red */
.cleaning { background: #ffc107; color: black; } /* Yellow */
.maintenance { background: #007bff; }  /* Blue */
.working { background: #6c757d; color: white; } /* Gray */

</style>
</head>

<body>

<h1>🏨 SPSS Hostel Room</h1>

<div class="controls">
  <select id="floorFilter">
    <option value="">All Floors</option>
    <option value="1">1st</option>
    <option value="2">2nd</option>
    <option value="3">3rd</option>
    <option value="4">4th</option>
  </select>

  <input type="number" id="searchRoom" placeholder="Search room">
</div>

<div class="stats">
  <div>🟢 <span id="emptyCount">0</span> - ખાલી</div>
  <div>🔴 <span id="occupiedCount">0</span> - આપેલી </div>
  <div>🟡 <span id="cleaningCount">0</span> - સફાઇ </div>
  <div>🔵 <span id="maintenanceCount">0</span> - કાલે આપવાની </div>
  <div>⚫ <span id="workingCount">0</span> - અવ્યવસ્થા</div>
</div>

<div class="controls">
  <input type="number" id="newRoom" placeholder="Room number">
  <button onclick="addRoom()">➕ Add</button>

  <input type="number" id="deleteRoom" placeholder="Delete room">
  <button onclick="deleteRoom()">❌ Delete</button>
</div>

<div id="rooms"></div>

<script>
let allRooms = [];

async function loadRooms() {
  const res = await fetch('/api/rooms');
  allRooms = await res.json();
  renderRooms();
}

function renderRooms() {
  rooms.innerHTML = '';
  const floors = {};

  const stats = { empty:0, occupied:0, cleaning:0, maintenance:0, working:0 };
  allRooms.forEach(r => stats[r.status]++);

  emptyCount.innerText = stats.empty;
  occupiedCount.innerText = stats.occupied;
  cleaningCount.innerText = stats.cleaning;
  maintenanceCount.innerText = stats.maintenance;
  workingCount.innerText = stats.working;

  allRooms.forEach(r => {
    const floor = String(r.room).slice(0, -2);
    if (!floors[floor]) floors[floor] = [];
    floors[floor].push(r);
  });

  Object.keys(floors).sort().forEach(floor => {
    const sec = document.createElement('div');
    sec.className = 'floor-section';
    sec.innerHTML = `<div class="floor-title">Floor ${floor}</div>`;

    const wrap = document.createElement('div');
    wrap.className = 'floor-rooms';

    floors[floor].forEach(r => {
      const btn = document.createElement('button');
      btn.className = `room-btn ${r.status}`;
      btn.innerText = r.room;
      btn.onclick = () => cycleStatus(r);

      if (r.note) {
        btn.innerHTML += `<span class="note-icon">📝</span>
          <div class="note-tooltip">${r.note}</div>`;
      }

      btn.addEventListener('contextmenu', e => {
        e.preventDefault();
        editNote(r.room, r.note);
      });

      let t;
      btn.addEventListener('touchstart', () => {
        t = setTimeout(() => editNote(r.room, r.note), 600);
      });
      btn.addEventListener('touchend', () => clearTimeout(t));

      wrap.appendChild(btn);
    });

    sec.appendChild(wrap);
    rooms.appendChild(sec);
  });
}

async function editNote(room, oldNote = '') {
  const note = prompt(`Note for Room ${room}`, oldNote);
  if (note === null) return;

  await fetch('/api/room-note/' + room, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ note })
  });

  loadRooms();
}

async function cycleStatus(r) {
  const order = ['empty','occupied','cleaning','maintenance','working'];
  const next = order[(order.indexOf(r.status)+1)%order.length];

  await fetch('/api/room/' + r.room, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({status:next})
  });

  loadRooms();
}

async function addRoom() {
  const room = newRoom.value;
  if (!room) return alert('Enter room');

  await fetch('/api/add-room', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({room:Number(room)})
  });

  newRoom.value='';
  loadRooms();
}

async function deleteRoom() {
  const room = deleteRoom.value;
  if (!room) return;

  await fetch('/api/delete-room/' + room, { method:'DELETE' });
  deleteRoom.value='';
  loadRooms();
}

loadRooms();
</script>

</body>
</html>
